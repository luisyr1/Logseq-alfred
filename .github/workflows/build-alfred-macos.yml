name: Build Alfred multiplatform

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-alfred-macos.yml
      - resources/forge.config.js
      - resources/package.json
      - src/electron/**
      - src/main/frontend/**

permissions:
  contents: write

env:
  CLOJURE_VERSION: '1.11.1.1413'
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Choose version
        id: version
        run: |
          echo "build_version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create private draft while builds run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Logseq Alfred ${BUILD_VERSION}" \
            --notes "Versión personal para macOS Apple Silicon, macOS Intel y Linux x64. Incluye actualización desde la propia aplicación en macOS. Las aplicaciones de macOS no están firmadas ni notarizadas por Apple." \
            --draft

  build:
    name: Build ${{ matrix.label }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-14
            target: macos-arm64
            make_command: electron:make-macos-arm64
          - label: macOS Intel
            runner: macos-15-intel
            target: macos-x64
            make_command: electron:make-macos-x64
          - label: Linux x64
            runner: ubuntu-latest
            target: linux-x64
            make_command: electron:make-linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@10.1
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply release version
        env:
          BUILD_VERSION: ${{ needs.prepare-release.outputs.build_version }}
        run: |
          node -e "const fs=require('fs'); const p='src/main/frontend/version.cljs'; const s=fs.readFileSync(p,'utf8'); fs.writeFileSync(p,s.replace(/\(defonce version \"[^\"]+\"\)/, '(defonce version \"' + process.env.BUILD_VERSION + '\")'))"

      - name: Compile Logseq
        run: yarn install --frozen-lockfile && yarn gulp:build && yarn cljs:release-electron

      - name: Apply version to desktop package
        working-directory: static
        env:
          BUILD_VERSION: ${{ needs.prepare-release.outputs.build_version }}
        run: |
          npm pkg set version="${BUILD_VERSION}"
          echo "${BUILD_VERSION}" > VERSION

      - name: Prepare desktop dependencies
        working-directory: static
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          yarn install --ignore-platform
          yarn rebuild:all
          if [ "${BUILD_TARGET}" = "macos-arm64" ]; then
            cd node_modules/dugite
            npm_config_arch=arm64 node script/download-git.js
          fi

      - name: Build installer
        working-directory: static
        run: yarn ${{ matrix.make_command }}

      - name: Collect installers
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_VERSION: ${{ needs.prepare-release.outputs.build_version }}
        run: |
          mkdir -p builds
          case "${BUILD_TARGET}" in
            macos-arm64)
              cp static/out/make/*.dmg "builds/Logseq-OG-darwin-arm64-${BUILD_VERSION}.dmg"
              cp static/out/make/zip/darwin/arm64/*.zip "builds/Logseq-OG-darwin-arm64-${BUILD_VERSION}.zip"
              ;;
            macos-x64)
              cp static/out/make/*.dmg "builds/Logseq-OG-darwin-x64-${BUILD_VERSION}.dmg"
              cp static/out/make/zip/darwin/x64/*.zip "builds/Logseq-OG-darwin-x64-${BUILD_VERSION}.zip"
              ;;
            linux-x64)
              cp static/out/make/*-*.AppImage "builds/Logseq-OG-linux-x64-${BUILD_VERSION}.AppImage"
              cp static/out/make/zip/linux/x64/*.zip "builds/Logseq-OG-linux-x64-${BUILD_VERSION}.zip"
              ;;
          esac

      - name: Upload installers to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: gh release upload "${RELEASE_TAG}" builds/* --repo "${GITHUB_REPOSITORY}" --clobber

  publish-release:
    name: Publish complete release
    needs:
      - prepare-release
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Publish only after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
