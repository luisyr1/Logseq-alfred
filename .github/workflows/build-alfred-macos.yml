name: Build Alfred for macOS Apple Silicon

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOJURE_VERSION: '1.11.1.1413'
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  build-macos-arm64:
    name: Build Apple Silicon DMG
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@10.1
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Logseq
        run: yarn install && yarn gulp:build && yarn cljs:release-electron

      - name: Prepare desktop dependencies for Apple Silicon
        working-directory: static
        run: |
          yarn install --ignore-platform
          yarn rebuild:all
          cd node_modules/dugite
          npm_config_arch=arm64 node script/download-git.js

      - name: Build unsigned Apple Silicon DMG
        working-directory: static
        run: yarn electron:make-macos-arm64

      - name: Collect DMG
        run: |
          mkdir -p builds
          cp static/out/make/*.dmg "builds/Logseq-OG-Apple-Silicon-build-${GITHUB_RUN_NUMBER}.dmg"

      - name: Keep build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Logseq-OG-Apple-Silicon-build-${{ github.run_number }}
          path: builds/*.dmg
          retention-days: 14

      - name: Publish downloadable test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "alfred-build-${GITHUB_RUN_NUMBER}" \
            builds/*.dmg \
            --target "${GITHUB_SHA}" \
            --title "Logseq Alfred build ${GITHUB_RUN_NUMBER}" \
            --notes "Compilación personal de prueba para macOS Apple Silicon. Sin firma ni notarización de Apple." \
            --prerelease
