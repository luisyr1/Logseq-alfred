name: Build Alfred for macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-alfred-macos.yml
      - resources/forge.config.js
      - src/electron/**
      - src/main/frontend/**

permissions:
  contents: write

env:
  CLOJURE_VERSION: '1.11.1.1413'
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  build-macos-arm64:
    name: Build Apple Silicon DMG
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@10.1
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set unique Alfred version
        run: |
          export BUILD_VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          node -e "const fs=require('fs'); const p='src/main/frontend/version.cljs'; const s=fs.readFileSync(p,'utf8'); fs.writeFileSync(p,s.replace(/\(defonce version \"[^\"]+\"\)/, '(defonce version \"' + process.env.BUILD_VERSION + '\")'))"

      - name: Compile Logseq
        run: yarn install && yarn gulp:build && yarn cljs:release-electron

      - name: Apply version to desktop package
        working-directory: static
        run: |
          npm pkg set version="${BUILD_VERSION}"
          echo "${BUILD_VERSION}" > VERSION

      - name: Prepare desktop dependencies for Apple Silicon
        working-directory: static
        run: |
          yarn install --ignore-platform
          yarn rebuild:all
          cd node_modules/dugite
          npm_config_arch=arm64 node script/download-git.js

      - name: Build unsigned Apple Silicon DMG
        working-directory: static
        run: yarn electron:make-macos-arm64

      - name: Collect installers
        run: |
          mkdir -p builds
          cp static/out/make/*.dmg "builds/Logseq-OG-Apple-Silicon-${BUILD_VERSION}.dmg"
          cp static/out/make/zip/darwin/arm64/*.zip "builds/Logseq-OG-Apple-Silicon-${BUILD_VERSION}.zip"

      - name: Publish downloadable test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${BUILD_VERSION}" \
            builds/* \
            --target "${GITHUB_SHA}" \
            --title "Logseq Alfred ${BUILD_VERSION}" \
            --notes "Versión personal para macOS Apple Silicon. Estrena la ventana Qué hay de nuevo y permite plegar el constructor visual de las live queries. Incluye actualización desde la propia aplicación. Sin firma ni notarización de Apple."
